# What a deploy of each release needs done before or after it, for deploy.sh
# (morca#323): the image ships this file as /opt/morca/upgrade.toml, and a
# deploy from one release to a later one shows the steps of every release in
# between: a `manual` step is confirmed by hand, a `run` step (a morca command)
# is run in the scheduler after the pipelines are registered.
#
# Written by scripts/changelog.sh from changes/*.after.toml (changes/README.md);
# newest release first.

[[version]]
version = "1.8.0"

[[version.step]]
id = "renamed-activity"
when = "after"
run = "morca backfill --rerun --allow-append mojo_activity 2026-11-13"

[[version.step]]
id = "renamed-embed"
when = "after"
run = "morca backfill --rerun mojo_embed 2026-11-13"

[[version]]
version = "1.7.0"

[[version.step]]
id = "history-contributors"
when = "after"
run = "morca backfill --rerun --allow-append mojo_history @all"

[[version.step]]
id = "stats-dep-forks"
when = "after"
run = "morca backfill --rerun mojo_stats 2026-11-14"

[[version]]
version = "1.5.0"

[[version.step]]
id = "retool-file-mix"
when = "after"
run = "morca backfill --rerun mojo_retool @all"

[[version]]
version = "1.3.0"

[[version.step]]
id = "1.3.0-retool-subjects"
when = "after"
run = "morca backfill --rerun mojo_retool @all"

[[version]]
version = "1.2.0"

[[version.step]]
id = "1.2.0-retool"
when = "after"
run = "morca backfill --rerun mojo_retool @all"

[[version.step]]
id = "1.2.0-issues-first-run"
when = "after"
manual = "mojo_issues runs daily at 08:00 UTC; its first run reads every repo's whole issue history. To fill it now: morca backfill mojo_issues <today>."

[[version]]
version = "1.1.0"

[[version.step]]
id = "1.1.0-egress-hf"
when = "before"
manual = "The console and mojo_embed download their model from huggingface.co (133 MB, once): allow outbound HTTPS to it, and about 300 MB more memory for the console."

[[version.step]]
id = "1.1.0-embed-first-run"
when = "after"
manual = "mojo_embed first runs at 07:00 UTC; until then similar repos, categories and search by meaning are hidden. To fill them now: morca backfill mojo_embed <today>."
