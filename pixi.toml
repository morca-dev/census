parquet-full-mojo = { git = "https://github.com/magmalake/parquet.mojo.git", rev = "5d265f9004fdad1522b80c8770c8a7a7f5f9f089", subdirectory = "full" }
deflate-mojo = { git = "https://github.com/magmalake/deflate.mojo.git", rev = "c3dfb87f5b09fb2559449dcb8b748629da4908af" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo.git", rev = "0d76aa7b672c85580f4d8c5de855772bc972d535" }
avro-mojo = { git = "https://github.com/magmalake/avro.mojo.git", rev = "d5b26ccefa8c49cc3af517731f5df104762119e0" }
roaring-mojo = { git = "https://github.com/magmalake/roaring.mojo.git", rev = "a90a7bd30cf1c21403a29059282072e93fbeeee2" }
hashes-mojo = { git = "https://github.com/magmalake/hashes.mojo.git", rev = "395aca597f9410bd0511df44d972f14b10a8b01d" }
iceberg-mojo = { git = "https://github.com/magmalake/iceberg.mojo.git", rev = "bb361f975f9f56d33218850a5f3d048202a85f02" }
morca-mojo = { git = "https://github.com/morca-dev/morca.git", rev = "e69edea753e1b1605a36f75d81dca56a2d8315bf" }
# mojo_embed's sentence embeddings; brings max-core (its matmul kernels).
encoder-mojo = { git = "https://github.com/magmalake/encoder.mojo.git", rev = "34d8651903c4a4f94d9025de15a88cd3693e2df7" }
postgresql = ">=18.4,<19"
git = ">=2.56.0,<3"
