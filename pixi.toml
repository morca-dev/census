[workspace]
preview = ["pixi-build"]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "census"
# macOS 13.3: conda-forge's postgresql 18.7 needs it (18.4, the last that
# didn't, wants an lz4-c older than the one lz4-mojo's shim is built with).
platforms = [{ name = "osx-arm64-macos13", platform = "osx-arm64", macos = "13.3" }, "linux-aarch64", "linux-64"]
version = "1.5.1"

[tasks]
# Each program alone (the image builds them all as one: `build` below).
build-morca = "mkdir -p build && rm -f build/morca && mojo build bin/scheduler.mojo -o build/morca"
# Snapshot expiry, which `morca expire` and the scheduler run beside morca.
build-maintain = "mkdir -p build && rm -f build/morca_maintain && mojo build bin/morca_maintain.mojo -o build/morca_maintain"
build-console = "mkdir -p build && rm -f build/console && mojo build -I src bin/console.mojo -o build/console"
build-gharchive = "mkdir -p build && rm -f build/gharchive && mojo build -I src pipelines/gharchive.mojo -o build/gharchive"
build-mojo-repos = "mkdir -p build && rm -f build/mojo_repos && mojo build -I src pipelines/mojo_repos.mojo -o build/mojo_repos"
build-mojo-history = "mkdir -p build && rm -f build/mojo_history && mojo build -I src pipelines/mojo_history.mojo -o build/mojo_history"
build-mojo-versions = "mkdir -p build && rm -f build/mojo_versions && mojo build -I src pipelines/mojo_versions.mojo -o build/mojo_versions"
build-mojo-activity = "mkdir -p build && rm -f build/mojo_activity && mojo build -I src pipelines/mojo_activity.mojo -o build/mojo_activity"
build-mojo-stats = "mkdir -p build && rm -f build/mojo_stats && mojo build -I src pipelines/mojo_stats.mojo -o build/mojo_stats"
build-gharchive-index = "mkdir -p build && rm -f build/gharchive_index && mojo build -I src pipelines/gharchive_index.mojo -o build/gharchive_index"
build-mojo-embed = "mkdir -p build && rm -f build/mojo_embed && mojo build -I src pipelines/mojo_embed.mojo -o build/mojo_embed"
build-mojo-issues = "mkdir -p build && rm -f build/mojo_issues && mojo build -I src pipelines/mojo_issues.mojo -o build/mojo_issues"
build-mojo-live = "mkdir -p build && rm -f build/mojo_live && mojo build -I src pipelines/mojo_live.mojo -o build/mojo_live"
build-mojo-retool = "mkdir -p build && rm -f build/mojo_retool && mojo build -I src pipelines/mojo_retool.mojo -o build/mojo_retool"
build-mojo-refresh = "mkdir -p build && rm -f build/mojo_refresh && mojo build -I src pipelines/mojo_refresh.mojo -o build/mojo_refresh"
build-pipelines = { depends-on = ["build-gharchive", "build-gharchive-index", "build-mojo-repos", "build-mojo-history", "build-mojo-retool", "build-mojo-versions", "build-mojo-activity", "build-mojo-stats", "build-mojo-embed", "build-mojo-issues", "build-mojo-live", "build-mojo-refresh"] }
# Every program, as in the image: two multi-call binaries,
# build/multicall-apps and build/multicall-pipelines, and build/morca,
# build/gharchive... as links to them (scripts/build.sh), so the code they
# share compiles once. Each program's own task above still builds it alone,
# in place of its link.
build = "sh scripts/build.sh build build"
build-each = { depends-on = ["build-morca", "build-maintain", "build-pipelines", "build-console"] }
# Needs the network (three hours of GH Archive). `build/gharchive-main` is
# gharchive built from origin/main: `git archive origin/main | tar -x -C DIR`,
# then `mojo build -I DIR/src DIR/pipelines/gharchive.mojo -o build/gharchive-main`.
test-daily = { cmd = "sh scripts/test-daily.sh build/gharchive-main build/gharchive", depends-on = ["build-gharchive"] }
# Registers every pipeline of morca.toml, morca.dev.toml and morca.lab.toml
# into a fresh state, as a deploy does (needs `pixi run build`): a cycle or any
# other registration failure fails CI rather than a deploy.
test-register = "sh scripts/test-register.sh"
# Dry-runs every `morca backfill` step of upgrade.toml against a state where
# its pipelines have run before (morca.toml's and morca.dev.toml's; needs
# `pixi run build`): a step morca would refuse fails CI rather than a deploy.
test-upgrade = "sh scripts/test-upgrade.sh"
# Every tests/test_*.mojo, built once into one binary and each run as its
# own process (scripts/test.sh); `pixi run test test_versions` runs one.
test = "sh scripts/test.sh"

[dependencies]
# One toolchain: the census, its tests and its image use the Mojo nightly
# morca-mojo and every magmalake tin below are built with. A precompiled Mojo
# package (.mojoc) loads only in the compiler version that built it, so the
# pin is exact and moves with theirs; each tin is at a revision built with it,
# the same one wherever it is pinned in the graph. The full `mojo` package
# beside the compiler, for llvm-symbolizer (copied into the image) and mblack.
mojo-compiler = "==1.3.0.dev2026112605"
mojo = "==1.3.0.dev2026112605"
json_mlake = { git = "https://github.com/magmalake/json_mlake.git", rev = "af0329b8a8475f9f997b4de687a7dbd26741afe8" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo.git", rev = "215abd5c3fd47e38ef14b44fd32dceb6059c134f" }
flare_mlake = { git = "https://github.com/magmalake/flare_mlake.git", rev = "a359169442c864b94e72be81426d964a26626b82" }
k8s-mojo = { git = "https://github.com/magmalake/k8s.mojo.git", rev = "1264cfbe4fb4f20c191a40530f083a06aa568e2f" }
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo.git", rev = "308a48360005009c8b1e72d261d784018694d1fd" }
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo.git", rev = "a6a3d3072810d4b502be35ddb7bccda07ddc6b01" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo.git", rev = "ca8cdac533b2a155e83233d97146fc0267c642ad" }
dista-mojo = { git = "https://github.com/morca-dev/dista", rev = "94d523f6a86d23146b82f47a83b190e96af990cc" }
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "7cff96daa58ec2b2d479ca8b57ba14c15f80ea75" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo.git", rev = "fafcaf4f303fe297c0f43b99fcf420591ad9afb8" }
thrift-mojo = { git = "https://github.com/magmalake/thrift.mojo.git", rev = "12cea8948f144328ac5359b8630be802e5d7997b" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo.git", rev = "c239ce5c7be0a80a9e58f1fb2d2d1399c99f4500" }
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo.git", rev = "09ad0248af6713406ccdbf843301b47733fa55f3" }
snappy-mojo = { git = "https://github.com/magmalake/snappy.mojo.git", rev = "58f36f0e9d034be71806ed04ea0c09282bc9e72d" }
parquet-full-mojo = { git = "https://github.com/magmalake/parquet.mojo.git", rev = "ffa8ac27205411b06a4b4359e1749c132ba861ad", subdirectory = "full" }
deflate-mojo = { git = "https://github.com/magmalake/deflate.mojo.git", rev = "c0231d0089c45ba7b68cea8753278d95ba5130fe" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo.git", rev = "604d1da685f170f895d93197c4ef0aa2f3dfb30d" }
avro-mojo = { git = "https://github.com/magmalake/avro.mojo.git", rev = "16e56756650beba39abfda9360fa9aead513e079" }
roaring-mojo = { git = "https://github.com/magmalake/roaring.mojo.git", rev = "f34ccf4dedc86e44109252bc7bbbc6b6a5602574" }
hashes-mojo = { git = "https://github.com/magmalake/hashes.mojo.git", rev = "ed41211cae2c428c15131fd1042c0d4cb9786088" }
iceberg-mojo = { git = "https://github.com/magmalake/iceberg.mojo.git", rev = "dd5037f4d61b8be122546e82ba4faf361c8afeb5" }
morca-mojo = { git = "https://github.com/morca-dev/morca.git", rev = "506d61a2e54196d37ce95c9af332afb1b7bf7493" }
# mojo_embed's sentence embeddings; brings max-core (its matmul kernels).
encoder-mojo = { git = "https://github.com/magmalake/encoder.mojo.git", rev = "9f0127caf27692094bce06919c00555c699b1d9e" }
postgresql = ">=18.4,<19"
git = ">=2.56.0,<3"

# Development only: `ouromo`, an experimental build of the 1.2.0 compiler
# with a per-function object cache. `pixi run -e ouromo dev-build
# pipelines/mojo_issues.mojo` rebuilds one program in a bit more than half
# the time; the binaries are a few percent slower and larger, so nothing
# that ships is built here. No linux-aarch64 package exists. The only ouromo
# published (1.2.0.1) depends on mojo-compiler ==1.2.0, which can't be
# installed beside the Mojo above, so the feature and its environment are off
# until an ouromo built on that Mojo exists; then uncomment both, with its
# version (scripts/dev-build.sh is unchanged).
# [feature.ouromo]
# channels = ["https://prefix.dev/winding-lines/ouromo"]
# platforms = ["osx-arm64", "linux-64"]
#
# [feature.ouromo.dependencies]
# ouromo = "==1.2.0.1"
#
# # conda-forge's current postgresql needs macOS 13.3; pixi assumes 13.0.
# [feature.ouromo.system-requirements]
# macos = "13.3"
#
# [feature.ouromo.tasks]
# dev-build = "sh scripts/dev-build.sh"
#
# [environments]
# ouromo = ["ouromo"]
