name: CI

on:
  push:
    # dev: the branch the deployed images come from (morca
    # docs/hetzner.md, "A dev stack"); lab: the lab stack's, for testing morca
    # itself. main runs only the tests.
    branches: [main, dev, lab]
    tags: ['*']
  pull_request:

jobs:
  # Build every program and run the tests, as on a laptop: on arm64 (Hetzner's
  # CAX) and amd64 (x86 servers and clouds).
  test-arch:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Off before setup-pixi restores rattler's git cache: git's
      # background maintenance in a cached repo races its
      # `git clone --local` (mojo-census#135).
      - run: git config --global maintenance.auto false && git config --global gc.auto 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # pixi.lock is written by this version.
          pixi-version: v0.78.0
      - run: pixi run build
      - run: pixi run test
      - run: pixi run test-register
      # morca.dev.toml (the dev stack's) has morca.toml's pipelines, without
      # fills or a worker pool's placement, plus the dev-only ballast (#97).
      - name: morca.dev.toml matches morca.toml
        run: |
          diff <(grep '^\[pipelines\.' morca.toml) <(grep '^\[pipelines\.' morca.dev.toml | grep -vx '\[pipelines\.ballast\]')
          ! grep -nE '^[[:space:]]*(fills|fill_[a-z_]+|placement)[[:space:]]*=' morca.dev.toml

  # Build the image `morca aws push` builds, then run one hour of GH Archive
  # through the gharchive pipeline inside it: the Linux-only failures (a
  # library that won't link, a CA bundle in the wrong place) show up here
  # rather than on AWS. On main it is built and tested but not pushed: what
  # was merged there is pushed when it reaches dev, the branch both stacks
  # deploy from. main's build is what fills the compile cache pull requests
  # start from (below); pull requests build and test, without pushing.
  #
  # One per architecture, each on its own runner (no emulation), built for a
  # baseline CPU (Dockerfile.morca, MOJO_TARGET_CPU) and pushed as
  # <tag>-<arch>; `manifest` joins them under the tags deploys use.
  image-arch:
    name: image (${{ matrix.arch }}, ${{ matrix.runner }}, ${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            cpu: neoverse-n1
          - arch: amd64
            runner: ubuntu-24.04
            cpu: x86-64-v3
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/morca-dev/census
    steps:
      - uses: actions/checkout@v4
      # No layer cache (#117): with `type=gha,mode=max` each build wrote
      # several GB to GitHub's Actions cache, which holds 10 GB a repository,
      # so the next build found it evicted and still paid 8 to 11 minutes to
      # export. A hit would have saved only `pixi install` and the git build
      # (about 3 minutes); the compile runs on every commit anyway.
      # load puts the image in the runner's docker, for the steps below.
      - uses: docker/setup-buildx-action@v3
      # Mojo's compile cache (#153): only Dockerfile.morca's `mojo-cache`
      # mount, about 0.5 to 1 GB an architecture, not a layer cache. Saved per
      # commit, restored from the newest of this branch's, else main's (a
      # pull request can read its base branch's caches). The key has what
      # changes every compile: architecture, target CPU and -g level.
      - name: Mojo compile cache
        id: mojo-cache
        uses: actions/cache@v4
        with:
          # Outside the checkout, which is the image's build context.
          path: ${{ runner.temp }}/mojo-cache
          key: mojo-cache-${{ matrix.arch }}-${{ matrix.cpu }}-g1-${{ github.sha }}
          restore-keys: |
            mojo-cache-${{ matrix.arch }}-${{ matrix.cpu }}-g1-
      - name: The compile cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {"${{ runner.temp }}/mojo-cache": {"target": "/mojo-cache", "id": "mojo-cache"}}
          skip-extraction: ${{ steps.mojo-cache.outputs.cache-hit }}
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.morca
          tags: gharchive-image
          load: true
          build-args: |
            MORCA_SOURCE=https://github.com/${{ github.repository }}
            MORCA_COMMIT=${{ github.sha }}
            CENSUS_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            MOJO_TARGET_CPU=${{ matrix.cpu }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Size
        run: docker image ls gharchive-image --format '{{.Size}}'
      # Both settings files as `morca register` checks them.
      - name: morca config check, morca.toml, morca.dev.toml and morca.lab.toml
        run: |
          docker run --rm gharchive-image config check /opt/morca/morca.toml
          docker run --rm gharchive-image config check /opt/morca/morca.dev.toml
          docker run --rm gharchive-image config check /opt/morca/morca.lab.toml
      - name: One hour of 2025-01-01 inside the image
        run: |
          docker run --rm --entrypoint sh \
            -e GHARCHIVE_HOURS=0 -e MORCA_WAREHOUSE=/tmp/w gharchive-image \
            -c 'gharchive run --partitions 2025-01-01'
      # The encoder (max-core) links and loads in the image; its numbers are
      # checked by magmalake/encoder.mojo's own CI on the same runner type.
      - name: mojo_embed loads inside the image
        run: docker run --rm --entrypoint mojo_embed gharchive-image describe
      # The commit is the image's environment, not a -D define (#153): a
      # pipeline's describe, which `morca register` records, still has it.
      - name: describe reports the commit
        run: |
          docker run --rm --entrypoint gharchive gharchive-image describe | tee describe.json
          grep -q '"commit": "${{ github.sha }}"' describe.json
      - name: The console starts and answers
        run: |
          docker run -d --name console -p 8080:8080 -e PORT=8080 \
            -e MORCA_WAREHOUSE=/tmp/w --entrypoint console gharchive-image
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          docker logs console
          exit 1
      # What deploy/hetzner expects in morca: ghcr.io/morca-dev/census:<tag>,
      # pushed here as <tag>-<arch> from the image tested above, which
      # `manifest` joins under <tag>. On dev, lab and tags only; pull requests
      # build and test but never push. The tags (dev's, lab's and a tag's):
      # scripts/image-tags.sh.
      # Nothing pushes latest any more: it stays at main's last image.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          for t in $(scripts/image-tags.sh); do
            docker tag gharchive-image "$GHCR_IMAGE:$t-${{ matrix.arch }}"
            docker push "$GHCR_IMAGE:$t-${{ matrix.arch }}"
          done

  # `test` and `image`, the checks main's ruleset requires: each passes once
  # every architecture's job has (skipped counts).
  test:
    if: always()
    needs: test-arch
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test-arch.result }}" = success ]'
  image:
    if: always()
    needs: image-arch
    runs-on: ubuntu-latest
    steps:
      - run: 'case "${{ needs.image-arch.result }}" in success | skipped) ;; *) exit 1 ;; esac'

  # Each tag as one image for both architectures, so a server pulls its own.
  manifest:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    needs: image-arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/morca-dev/census
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures
        run: |
          for t in $(scripts/image-tags.sh); do
            docker buildx imagetools create -t "$GHCR_IMAGE:$t" \
              "$GHCR_IMAGE:$t-arm64" "$GHCR_IMAGE:$t-amd64"
            docker buildx imagetools inspect "$GHCR_IMAGE:$t" | grep -E 'Platform: +linux/(arm64|amd64)'
          done

  # A tag's GitHub release, once its image is pushed: the notes are the
  # version's section of CHANGELOG.md (changes/README.md).
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The release
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$RUNNER_TEMP/notes.md
          awk -v head="## $version " 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          printf '\nImage: `ghcr.io/morca-dev/census:%s` (`:%s`).\n' "$version" "${GITHUB_SHA::7}" >> "$notes"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "mojo-census $version" --notes-file "$notes"
          fi
