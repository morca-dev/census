# The dev stack's morca.toml (morca-dev/morca docs/hetzner.md, "A dev
# stack"). The image has it at /opt/morca/morca.dev.toml beside morca.toml; the
# dev stack's EXTRA_ENV_FILE sets MORCA_CONFIG=/opt/morca/morca.dev.toml, so
# `morca register` (no arguments) in its scheduler reads this file instead.
#
# The same pipelines as morca.toml, with the same settings, except:
#
# - No fills: `fills` is absent, so every pipeline has morca's default,
#   "since_registration". Its schedule runs from the day it's registered on,
#   and nothing redoes the backfill from 2023. morca has no "fill only the
#   last N days" setting; to give a new dev stack some history, backfill a
#   recent range by hand once, e.g.
#       docker exec scheduler morca backfill gharchive 2026-10-09..2026-11-07
#   (one partition a run, max_runs at a time).
# - No `placement = "worker:..."`: every pipeline runs on the dev server
#   itself, as in magmalake/mojo-census#86. A dev stack has no worker pool.
#
# - ballast (#97), only here: runs with known peaks, to check the learned
#   requests (morca #269) against.
#
# Keep the two files' [pipelines.*] tables the same apart from ballast: CI
# checks that they name the same pipelines, and that this one has no fills or
# placement.

[defaults]
max_runs = 1

[pipelines.gharchive]
# Learned from the last runs' peaks (morca #269), at most 6 GB: two fill runs
# fit the CAX21's ~6.5 GB to grant. No cpus: two learned 2-CPU requests
# against 3 grantable cores would hold the second fill run.
memory_gb = "auto..6"
# As morca.toml, without fills = "all", fill_order and fill_max_runs.
env = { DISTA_WORKER_SLOTS = "2", GHARCHIVE_PARALLEL = "2", GHARCHIVE_EVENTS = "off" }

[pipelines.gharchive_index]
env = { DISTA_WORKER_SLOTS = "1" }

[pipelines.mojo_repos]
# Learned (morca #269), so every pipeline on the host is counted.
memory_gb = "auto"
# Without the dev stack's GITHUB_TOKEN_FILE its runs fail on the secret.
secrets = { GITHUB_TOKEN = "orca/github-token" }

[pipelines.mojo_history]
# Fixed at 2 GB: beta's host grants at most 2.2 GB, and a learned request
# above that is never met (2.5 GB after the 1.7.0 backfill; morca #462).
memory_gb = "2"
# On the server, not the bgent pool (morca.toml's placement), two dista
# workers each like gharchive.
env = { DISTA_WORKER_SLOTS = "2" }

[pipelines.mojo_retool]
# Run by hand after a release that changes what the history reader records
# (upgrade.toml's `morca backfill --rerun mojo_retool @all`): it reads every
# repository's history again, as mojo_history does, so the same limits.
memory_gb = "auto..4"
env = { DISTA_WORKER_SLOTS = "2" }

[pipelines.mojo_versions]
# Learned (morca #269), at most 4 GB.
memory_gb = "auto..4"
env = { DISTA_WORKER_SLOTS = "2" }

[pipelines.mojo_activity]
# Learned (morca #269), at most 4 GB.
memory_gb = "auto..4"
env = { DISTA_WORKER_SLOTS = "2" }

[pipelines.mojo_stats]
# Learned (morca #269).
memory_gb = "auto"
secrets = { GITHUB_TOKEN = "orca/github-token" }

[pipelines.mojo_embed]
memory_gb = "auto..2"
env = { MOJO_EMBED_MODEL = "/tmp/mojo-census/models/bge-small-en-v1.5" }

[pipelines.mojo_issues]
memory_gb = "auto"
secrets = { GITHUB_TOKEN = "orca/github-token" }

# The Live page's poller: one run an hour that polls every 3 minutes, over
# GitHub's GraphQL API (its own rate limit: about 13 points a poll).
[pipelines.mojo_live]
memory_gb = "auto"
secrets = { GITHUB_TOKEN = "orca/github-token" }

[pipelines.ballast]
# Learned (morca #269), the subject of the test: pipelines/ballast.mojo has
# each day's peaks. Run by hand, e.g.
#   docker exec scheduler morca backfill ballast 2011-01-01..2011-01-22
memory_gb = "auto"
cpus = "auto"
