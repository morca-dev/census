[workspace]
preview = ["pixi-build"]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "census"
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]
version = "1.5.1"

[tasks]
# Each program alone (the image builds them all as one: `build` below).
build-morca = "mkdir -p build && rm -f build/morca && mojo build bin/scheduler.mojo -o build/morca"
# Snapshot expiry, which `morca expire` and the scheduler run beside morca.
build-maintain = "mkdir -p build && rm -f build/morca_maintain && mojo build bin/morca_maintain.mojo -o build/morca_maintain"
build-console = "mkdir -p build && rm -f build/console && mojo build -I src bin/console.mojo -o build/console"
build-gharchive = "mkdir -p build && rm -f build/gharchive && mojo build -I src pipelines/gharchive.mojo -o build/gharchive"
build-mojo-repos = "mkdir -p build && rm -f build/mojo_repos && mojo build -I src pipelines/mojo_repos.mojo -o build/mojo_repos"
build-mojo-history = "mkdir -p build && rm -f build/mojo_history && mojo build -I src pipelines/mojo_history.mojo -o build/mojo_history"
build-mojo-versions = "mkdir -p build && rm -f build/mojo_versions && mojo build -I src pipelines/mojo_versions.mojo -o build/mojo_versions"
build-mojo-activity = "mkdir -p build && rm -f build/mojo_activity && mojo build -I src pipelines/mojo_activity.mojo -o build/mojo_activity"
build-mojo-stats = "mkdir -p build && rm -f build/mojo_stats && mojo build -I src pipelines/mojo_stats.mojo -o build/mojo_stats"
build-gharchive-index = "mkdir -p build && rm -f build/gharchive_index && mojo build -I src pipelines/gharchive_index.mojo -o build/gharchive_index"
build-mojo-embed = "mkdir -p build && rm -f build/mojo_embed && mojo build -I src pipelines/mojo_embed.mojo -o build/mojo_embed"
build-mojo-issues = "mkdir -p build && rm -f build/mojo_issues && mojo build -I src pipelines/mojo_issues.mojo -o build/mojo_issues"
build-mojo-live = "mkdir -p build && rm -f build/mojo_live && mojo build -I src pipelines/mojo_live.mojo -o build/mojo_live"
build-mojo-retool = "mkdir -p build && rm -f build/mojo_retool && mojo build -I src pipelines/mojo_retool.mojo -o build/mojo_retool"
build-pipelines = { depends-on = ["build-gharchive", "build-gharchive-index", "build-mojo-repos", "build-mojo-history", "build-mojo-retool", "build-mojo-versions", "build-mojo-activity", "build-mojo-stats", "build-mojo-embed", "build-mojo-issues", "build-mojo-live"] }
# Every program, as in the image: two multi-call binaries,
# build/multicall-apps and build/multicall-pipelines, and build/morca,
# build/gharchive... as links to them (scripts/build.sh), so the code they
# share compiles once. Each program's own task above still builds it alone,
# in place of its link.
build = "sh scripts/build.sh build build"
build-each = { depends-on = ["build-morca", "build-maintain", "build-pipelines", "build-console"] }
# Needs the network (three hours of GH Archive). `build/gharchive-main` is
# gharchive built from origin/main: `git archive origin/main | tar -x -C DIR`,
# then `mojo build -I DIR/src DIR/pipelines/gharchive.mojo -o build/gharchive-main`.
test-daily = { cmd = "sh scripts/test-daily.sh build/gharchive-main build/gharchive", depends-on = ["build-gharchive"] }
# Registers every pipeline of morca.toml, morca.dev.toml and morca.lab.toml
# into a fresh state, as a deploy does (needs `pixi run build`): a cycle or any
# other registration failure fails CI rather than a deploy.
test-register = "sh scripts/test-register.sh"
test = "mojo run -I src tests/test_versions.mojo && mojo run -I src tests/test_history.mojo && mojo run -I src tests/test_contributors.mojo && mojo run -I src tests/test_datafiles.mojo && mojo run -I src tests/test_jscan.mojo && mojo run -I src tests/test_events.mojo && mojo run -I src tests/test_search.mojo && mojo run -I src tests/test_names.mojo && mojo run -I src tests/test_republish.mojo && mojo run -I src tests/test_activity.mojo && mojo run -I src tests/test_hourindex.mojo && mojo run -I src tests/test_eventsoff.mojo && mojo run -I src tests/test_stats.mojo && mojo run -I src tests/test_overview.mojo && mojo run -I src tests/test_swap.mojo && mojo run -I src tests/test_checks.mojo && mojo run -I src tests/test_headversion.mojo && mojo run -I src tests/test_deps.mojo && mojo run -I src tests/test_model.mojo && mojo run -I src tests/test_sortrows.mojo && mojo run -I src tests/test_eventrows.mojo && mojo run -I src tests/test_hourmemory.mojo && mojo run -I src tests/test_fetch.mojo && mojo run -I src tests/test_analytics.mojo && mojo run -I src tests/test_embedtext.mojo && mojo run -I src tests/test_changelog.mojo && mojo run -I src tests/test_similar.mojo && mojo run -I src tests/test_categories.mojo && mojo run -I src tests/test_querymodel.mojo && mojo run -I src tests/test_issues.mojo && mojo run -I src tests/test_embedmodel.mojo && mojo run -I src tests/test_committype.mojo && mojo run -I src tests/test_filemix.mojo && mojo run -I src tests/test_live.mojo && mojo run -I src tests/test_console_routes.mojo"

[dependencies]
mojo-compiler = "==1.2.0"
# llvm-symbolizer (copied into the image) and mblack: flare_mlake and json_mlake
# brought the full mojo package in until they shipped as .mojoc.
mojo = "==1.2.0"
json_mlake = { git = "https://github.com/magmalake/json_mlake.git", rev = "27c05c1c0c2881abfb33ce8eefae4d44d8b602a9" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo.git", rev = "f45e780a8de77278c140cee36904e46e93e0ca1c" }
flare_mlake = { git = "https://github.com/magmalake/flare_mlake.git", rev = "b2c5823dc0f9ef95906978a9bdfda1d1ce505fa8" }
k8s-mojo = { git = "https://github.com/magmalake/k8s.mojo.git", rev = "1aa5b087c06e41313f0f629509260062fdac661b" }
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo.git", rev = "40068c4f95ea659e9b78aa91ced45420b07e3e6e" }
