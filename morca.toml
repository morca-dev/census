# How the census's pipelines run under morca. `morca register` (no arguments) in
# the scheduler container reads this file: the image has it at
# /opt/morca/morca.toml (MORCA_CONFIG) and the binaries at /opt/morca/pipelines.
# To change a setting: edit this file, merge, deploy the new image, register
# again. morca-dev/morca docs/morca-toml.md and docs/hetzner.md say more.

[defaults]
# One run of a pipeline at a time. Concurrent commits to one table are safe
# since iceberg-mojo 0.11.1 (morca-dev/morca#164), but on the CAX21 the
# cores, not the runs, are the limit: gharchive goes faster with more hours in
# flight in one run (below) than with more runs.
max_runs = 1

[pipelines.gharchive]
# Learned from the last runs' peaks (morca #269), at most 6 GB: two fill runs
# fit the CAX21's ~6.5 GB to grant. No cpus: two learned 2-CPU requests
# against 3 grantable cores would hold the second fill run.
memory_gb = "auto..6"
# Fill the whole range (from the first partition to yesterday) by itself,
# oldest day first, two fill runs at a time on top of max_runs: while one
# run does its day's serial merge and commit, the other keeps downloading.
# On the CAX21 two runs at 2 and 2 (below) went from 21.8 to about 32 days an
# hour (2026-11-07), and to about 65 with GHARCHIVE_EVENTS off.
fills = "all"
fill_order = "oldest"
fill_max_runs = 2
# GH Archive publishes each hour's file some minutes after the hour, so at
# 00:00 UTC the day that just ended isn't all there: the fill's load_day
# attempts failed until the last hour appeared (~00:09), and the failures
# tripped the watchdog, which paused gharchive (run 5172, 2026-11-09). With
# the lag a day fills from 02:00 UTC (morca docs/morca-toml.md#the-lag).
fill_lag = "2h"
# DISTA_WORKER_SLOTS: dista workers in one process. GHARCHIVE_PARALLEL: hours
# in flight at once; its default of 16 is sized for four AWS instances. Keep
# the two equal. Before #37 an hour in flight took 2 GB or more: on the CAX21
# (4 vCPU, 8 GB), 16 hit 99.6% memory and the kernel killed workers, 3 peaked
# near 7 GB and swapped hard, and 2 and 2 peaked under 2 GB and ran a day in
# about 3.5 minutes. Since #37 an hour takes about 450 MB (HOUR_MEMORY_MB in
# src/eventrows.mojo), plus about 300 MB for the run: 4 and 4 is the safe
# value on the CAX21: a busy 2023 day under 4 vCPU and 8 GB peaked at 1.8 GB
# and ran 26% faster than at 2 and 2 before #37 (2 and 2 now peak at 1.2 GB);
# above 4 the cores, not memory, are the limit. On the CAX41 (16 vCPU, 32 GB)
# 12 and 12, about 5.7 GB.
#
# Timeouts and retries of an hour's download (#49), defaults in brackets:
# GHARCHIVE_CONNECT_SECONDS (20) for the connect and TLS handshake,
# GHARCHIVE_IDLE_SECONDS (30) of silence before a stalled read fails,
# GHARCHIVE_TIMEOUT_SECONDS (900) for the whole hour, every try included, and
# GHARCHIVE_RETRIES (4) after the first try, with backoff 1 s, 2 s, 4 s ...
# up to 30 s (README, "Timeouts and retries"). Before #49 a stalled read
# had no timeout, and a fill run waited 5 h 39 m on one.
#
# GHARCHIVE_EVENTS (on): off stops writing gharchive.events (1.1 GB a day,
# 97% of the bucket) and keeps candidates, repo_hour and releases, the same
# rows either way. An hour in flight then takes about 200 MB
# (HOUR_INDEX_MEMORY_MB) instead of 450 MB. The registry hash doesn't change,
# so runs done either way count. README, "Without the events".
#
# What the server runs: two fill runs at 2 and 2, four hours in flight on the
# four cores (the CPU, not memory, is the limit, at 2.7 of 8 GB), and the raw
# events off: the site and the mojo_* pipelines read only the derived tables.
env = { DISTA_WORKER_SLOTS = "2", GHARCHIVE_PARALLEL = "2", GHARCHIVE_EVENTS = "off" }

[pipelines.gharchive_index]
# Paused on the server: with GHARCHIVE_EVENTS off it has no new raw events to
# index; it only covers days whose events were kept.
env = { DISTA_WORKER_SLOTS = "1" }

[pipelines.mojo_repos]
# Learned (morca #269), so every pipeline on the host is counted.
memory_gb = "auto"
# With a token mojo_repos checks 1000 candidates a run, 25 without.
secrets = { GITHUB_TOKEN = "orca/github-token" }
# The search backfill runs as fill runs (`morca backfill --as-fill`, the
# 185-mojo-search after-step): a month of days a run, one run at a time,
# 02:00-08:00 UTC, after the other pipelines. keys_per_run also sizes a
# plain backfill's runs.
keys_per_run = 31
fill_max_runs = 1
fill_window = "2..8"
priority = -10

[pipelines.mojo_history]
# Learned (morca #269), at most 4 GB, so its clones count against gharchive's grants.
memory_gb = "auto..4"
# Clones (here and in mojo_versions): GIT_TIMEOUT_SECONDS (600) kills one
# that runs longer, GIT_RETRIES (3) more tries with backoff, and git aborts a
# transfer under GIT_LOW_SPEED_LIMIT (1000) bytes a second for
# GIT_LOW_SPEED_SECONDS (60). A repository that still fails is logged and
# skipped for the run.
#
# These three ran on the bgent worker pool (README, "A second machine")
# while gharchive's backfill had the CAX21's cores. With it done they run on
# the server again, two dista workers each like gharchive. To move them back,
# add placement = "worker:bgent" to each.
env = { DISTA_WORKER_SLOTS = "2" }
# Takes turns with the other writers of its tables (see mojo_refresh below).
concurrency = { key = "mojo_repo_rows", limit = 1 }

[pipelines.mojo_retool]
# Run by hand after a release that changes what the history reader records
# (upgrade.toml's `morca backfill --rerun mojo_retool @all`): it reads every
# repository's history again, as mojo_history does, so the same limits.
memory_gb = "auto..4"
env = { DISTA_WORKER_SLOTS = "2" }
# Takes turns with the other writers of its tables (see mojo_refresh below).
concurrency = { key = "mojo_repo_rows", limit = 1 }

[pipelines.mojo_versions]
# Learned (morca #269), at most 4 GB.
memory_gb = "auto..4"
# Blobless clones of the repositories whose version is unknown, one dista
# task each; no GitHub API, so no token.
env = { DISTA_WORKER_SLOTS = "2" }
# Takes turns with the other writers of its tables (see mojo_refresh below).
concurrency = { key = "mojo_repo_rows", limit = 1 }

[pipelines.mojo_activity]
# Learned (morca #269), at most 4 GB.
memory_gb = "auto..4"
env = { DISTA_WORKER_SLOTS = "2" }

# Daily at 06:00 UTC; one GET /repos/{owner}/{repo} per repository, which
# unauthenticated is 60 an hour.
[pipelines.mojo_stats]
# Learned (morca #269).
memory_gb = "auto"
secrets = { GITHUB_TOKEN = "orca/github-token" }

# Daily at 07:00 UTC, after mojo_stats; embeds only the repositories whose
# name, description or topics changed (about 180 a second on the CAX21's
# four cores, ~310 MB). The model isn't in the image: the first run after a
# deploy downloads it (133 MB) into MOJO_EMBED_MODEL and checks its hash.
[pipelines.mojo_embed]
memory_gb = "auto..2"
env = { MOJO_EMBED_MODEL = "/tmp/mojo-census/models/bge-small-en-v1.5" }

# Daily at 08:00 UTC, two hours after mojo_stats (they share the token's
# hourly limit): each repository's issues and pull requests changed since
# the last run. The first run is about 1,300 requests plus pages for the
# long histories.
[pipelines.mojo_issues]
memory_gb = "auto"
secrets = { GITHUB_TOKEN = "orca/github-token" }

# The Live page's poller: one run an hour that polls every 3 minutes, over
# GitHub's GraphQL API (its own rate limit: about 13 points a poll).
[pipelines.mojo_live]
memory_gb = "auto"
secrets = { GITHUB_TOKEN = "orca/github-token" }
# One mojo_live run at a time across the cluster, also across a deploy's
# handover (morca#503; needs HANDOVER_WAIT_SECONDS in hetzner.env).
concurrency = { key = "mojo_live", limit = 1 }

# Hourly at :30: reads again the repositories whose head (mojo.live_heads)
# moved since their last read, 60 a run, longest stale first, as mojo_retool
# and mojo_versions read them (two clones each: the full history and a
# blobless HEAD), and records each try in mojo.refreshed. 60 an hour drains
# the backlog of ~1,950 repositories in about a day and a half; then a
# repository's rows follow its head within about 7 hours (6 hours' rest after
# a read, 24 for one over 1 GB like modular/modular; a failed read waits 6
# hours, doubling up to a week). The same limits as mojo_retool.
# MOJO_REFRESH_MAX_REPOS, _MIN_HOURS, _BIG_KB, _BIG_HOURS, _RETRY_HOURS and
# _MAX_RETRY_HOURS override the defaults (pipelines/mojo_refresh.mojo).
[pipelines.mojo_refresh]
memory_gb = "auto..4"
env = { DISTA_WORKER_SLOTS = "2" }
# One run at a time of the pipelines that write these tables (mojo_history,
# mojo_retool, mojo_versions and this one), across the cluster and a deploy's
# handover: each reads a table whole and replaces it, or (mojo_history)
# appends the repositories it found missing, so a run that read before
# another's commit could write back old rows or add some twice
# (src/rewrite.mojo). After a deploy a run of the new version waits at most
# HANDOVER_WAIT_SECONDS for one of the old to end, so their runs stay well
# under it: 60 repositories here, 50 in the others.
concurrency = { key = "mojo_repo_rows", limit = 1 }
